[package]
name = "s3-wire-bench"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
object_store = { version = "=0.13.2", features = ["aws"] }
parquet = { version = "=59.2.0", features = ["async", "object_store"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
serde_json = "1"
