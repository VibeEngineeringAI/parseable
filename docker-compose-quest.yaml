# Pin Quest until stream DELETE returns 202 (issue #151).
# To remove the pin, find all references: grep -rn 'issue #151\|f4a026e'
services:
  quest-source:
    build:
      context: https://github.com/parseablehq/quest.git#${QUEST_SOURCE_REF:-f4a026eecde1badde8776ff366a743f9bbca2e67}
    # Rebuild by default so changing QUEST_SOURCE_REF cannot reuse stale source.
    # Compose tags this as <project>-quest; refs (which may contain /) are not tags.
    # BuildKit caches layers, but the git context still needs network access.
    # For offline/repeat runs: docker compose build quest once, then up --no-build.
    pull_policy: ${QUEST_PULL_POLICY:-build}

  # Selected by the calling file whenever QUEST_IMAGE is nonempty. No build
  # context: an explicit image can never be overwritten by a source build.
  quest-source-image:
    image: ${QUEST_IMAGE:-}
    pull_policy: ${QUEST_PULL_POLICY:-missing}
