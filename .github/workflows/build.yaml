name: Ensure parseable builds on all release targets

on:
  # Temporarily pause automatic builds for the release target matrix.
  workflow_dispatch:

# Each job builds the frontend into this absolute path before cargo runs.
env:
  NEXT_ASSETS_PATH: ${{ github.workspace }}/frontend/dist

jobs:
  # Default build without Kafka
  build-default:
    name: Build Default ${{matrix.target}}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds - both native, matching the release workflow
          - os: blacksmith-8vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
          - os: blacksmith-8vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-gnu

          # macOS build - aarch64 only (M1/M2)
          - os: macos-latest
            target: aarch64-apple-darwin

          # Windows build
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install GCC 11 on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-default-release

      - name: Build native
        env:
          CC: ${{ runner.os == 'Linux' && 'gcc-11' || '' }}
          CXX: ${{ runner.os == 'Linux' && 'g++-11' || '' }}
        run: cargo build --target ${{ matrix.target }} --release

  # Kafka build for x86_64 Linux only
  build-kafka:
    name: Build Kafka x86_64-unknown-linux-gnu
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-11 \
            g++-11 \
            build-essential \
            pkg-config \
            cmake \
            clang \
            zlib1g-dev \
            libzstd-dev \
            liblz4-dev \
            libssl-dev \
            libsasl2-dev \
            python3

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu-kafka-release

      - name: Find and fix librdkafka CMakeLists.txt
        run: |
          cargo fetch
          RDKAFKA_SYS_DIR=$(find ~/.cargo/registry/src -name "rdkafka-sys-*" -type d | head -n 1)
          echo "Found rdkafka-sys at: $RDKAFKA_SYS_DIR"
          CMAKE_FILE="$RDKAFKA_SYS_DIR/librdkafka/CMakeLists.txt"
          if [ -f "$CMAKE_FILE" ]; then
            echo "Found CMakeLists.txt at: $CMAKE_FILE"
            cp "$CMAKE_FILE" "$CMAKE_FILE.bak"
            sed -i 's/cmake_minimum_required(VERSION 3.2)/cmake_minimum_required(VERSION 3.5)/' "$CMAKE_FILE"
            echo "Modified CMakeLists.txt - before and after comparison:"
            diff "$CMAKE_FILE.bak" "$CMAKE_FILE" || true
          else
            echo "Could not find librdkafka CMakeLists.txt file!"
            exit 1
          fi

      - name: Build with Kafka
        env:
          CC: gcc-11
          CXX: g++-11
          LIBRDKAFKA_SSL_VENDORED: "1"
        run: cargo build --target x86_64-unknown-linux-gnu --features kafka --release

  # Kafka build for aarch64 macOS
  build-kafka-mac:
    name: Build Kafka aarch64-apple-darwin
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install macOS dependencies
        run: |
          brew install \
            llvm \
            pkg-config \
            zstd \
            lz4 \
            openssl@3.0 \
            cyrus-sasl \
            python3

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin-kafka-release

      - name: Find and fix librdkafka CMakeLists.txt
        run: |
          cargo fetch
          RDKAFKA_SYS_DIR=$(find ~/.cargo/registry/src -name "rdkafka-sys-*" -type d | head -n 1)
          echo "Found rdkafka-sys at: $RDKAFKA_SYS_DIR"
          CMAKE_FILE="$RDKAFKA_SYS_DIR/librdkafka/CMakeLists.txt"
          if [ -f "$CMAKE_FILE" ]; then
            echo "Found CMakeLists.txt at: $CMAKE_FILE"
            cp "$CMAKE_FILE" "$CMAKE_FILE.bak"
            sed -i '' 's/cmake_minimum_required(VERSION 3.2)/cmake_minimum_required(VERSION 3.5)/' "$CMAKE_FILE"
            echo "Modified CMakeLists.txt - before and after comparison:"
            diff "$CMAKE_FILE.bak" "$CMAKE_FILE" || true
          else
            echo "Could not find librdkafka CMakeLists.txt file!"
            exit 1
          fi

      - name: Build with Kafka
        env:
          LIBRDKAFKA_SSL_VENDORED: "1"
        run: cargo build --target aarch64-apple-darwin --features kafka --release
