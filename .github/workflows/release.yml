# This workflow builds Parseable for Linux, Mac, Windows and Docker
# and publishes the artifacts to the GitHub release page.
# Automatic tag builds are temporarily paused. Run this workflow manually
# with an existing release tag (e.g., v1.0.0, v2.3.4).
# Binaries build on GitHub-hosted runners because this fork has no
# self-hosted runners. The Docker images publish to upstream's Quay
# repository, so that job runs only in parseablehq/parseable.
# It also creates a checksum file for the artifacts and publishes it to the release page.
# It also builds and pushes a Docker image to Docker Hub with the same version tag.
# Linux jobs run on Blacksmith runners. The build-profile input can select the
# experimental release-thin-lto profile; such runs upload workflow artifacts
# only and never publish to the release page or registry.

name: Release builds for Linux(64 bit, Arm), Mac(64bit, Arm), Windows and Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag; thin-LTO experiments may also use a branch or commit containing that profile'
        required: true
        type: string
      build-profile:
        description: 'Cargo profile (release-thin-lto is experimental and skips publishing)'
        required: false
        type: choice
        default: release-lto
        options:
          - release-lto
          - release-thin-lto

# Never cancel a release mid-publish; a second run for the same tag waits.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

# Each job builds the frontend into this absolute path before cargo runs.
env:
  NEXT_ASSETS_PATH: ${{ github.workspace }}/frontend/dist
  RELEASE_PROFILE: ${{ inputs.build-profile || 'release-lto' }}

jobs:
  build-frontend:
    name: Package frontend
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-profile == 'release-thin-lto' && inputs.tag || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Package frontend
        working-directory: frontend
        run: npm run package

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: parseable-frontend
          path: |
            frontend/build.zip
            frontend/build.zip.sha1
          if-no-files-found: error

      - name: Attach frontend to release
        if: env.RELEASE_PROFILE == 'release-lto'
        uses: softprops/action-gh-release@v0.1.15
        with:
          draft: false
          tag_name: ${{ inputs.tag }}
          files: |
            frontend/build.zip
            frontend/build.zip.sha1
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build for ${{matrix.target}}
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-8vcpu-ubuntu-2404
          # A hosted runner lost contact during the cross-compiled LTO build,
          # so aarch64 builds natively on an Arm runner.
          - target: aarch64-unknown-linux-gnu
            os: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-profile == 'release-thin-lto' && inputs.tag || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-default-${{ env.RELEASE_PROFILE }}

      # The aarch64 runner lost contact during the fat-LTO build twice, which
      # GitHub attributes to CPU or memory starvation. Free disk, add swap and
      # record the resources as annotations, which survive a lost runner.
      # Swap is best effort because runner disk layouts differ.
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          if sudo fallocate -l 16G /swap.release && sudo chmod 600 /swap.release \
            && sudo mkswap /swap.release && sudo swapon /swap.release; then
            echo "Added 16G swap"
          else
            echo "::warning title=Swap::Could not add swap; continuing without it"
          fi
          echo "::notice title=Runner resources::$(nproc) CPUs; $(free -h | awk '/Mem/{print $2" RAM"} /Swap/{print $2" swap"}' | paste -sd ' '); $(df -h --output=avail / | tail -1 | tr -d ' ') free on /"

      - name: Build native
        run: cargo build --profile "$RELEASE_PROFILE" --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mv target/${{ matrix.target }}/$RELEASE_PROFILE/parseable Parseable_OSS_${{ matrix.target }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: Parseable_OSS_${{ matrix.target }}

      - name: Create Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parseable_OSS_${{ matrix.target }}
          path: Parseable_OSS_${{ matrix.target }}

      - name: Publish Archive to Release Page
        if: env.RELEASE_PROFILE == 'release-lto'
        uses: softprops/action-gh-release@v0.1.15
        with:
          draft: false
          tag_name: ${{ inputs.tag }}
          files: Parseable_OSS_${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-profile == 'release-thin-lto' && inputs.tag || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-default-${{ env.RELEASE_PROFILE }}

      - name: Build
        run: cargo build --all --profile ${{ env.RELEASE_PROFILE }} --target x86_64-pc-windows-msvc

      - name: Rename binary
        run: |
          mv target/x86_64-pc-windows-msvc/${{ env.RELEASE_PROFILE }}/PARSEABLE.exe Parseable_OSS_x86_64-pc-windows-msvc.exe

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: Parseable_OSS_x86_64-pc-windows-msvc.exe

      - name: Create artifact for Windows
        uses: actions/upload-artifact@v4
        with:
          name: Parseable_OSS_x86_64-pc-windows-msvc.exe
          path: Parseable_OSS_x86_64-pc-windows-msvc.exe

      - name: Publish Archive to Release Page
        if: env.RELEASE_PROFILE == 'release-lto'
        uses: softprops/action-gh-release@v0.1.15
        with:
          draft: false
          tag_name: ${{ inputs.tag }}
          files: Parseable_OSS_x86_64-pc-windows-msvc.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: write
      attestations: write
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-profile == 'release-thin-lto' && inputs.tag || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-default-${{ env.RELEASE_PROFILE }}

      - name: Build
        run: |
          cargo build --profile "$RELEASE_PROFILE" --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/$RELEASE_PROFILE/Parseable

      - name: Rename binary
        run: |
          mv target/${{ matrix.target }}/$RELEASE_PROFILE/Parseable Parseable_OSS_${{ matrix.target }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: Parseable_OSS_${{ matrix.target }}

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parseable_OSS_${{ matrix.target }}
          path: Parseable_OSS_${{ matrix.target }}

      - name: Publish Archive to Release Page
        if: env.RELEASE_PROFILE == 'release-lto'
        uses: softprops/action-gh-release@v0.1.15
        with:
          draft: false
          tag_name: ${{ inputs.tag }}
          files: Parseable_OSS_${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-kafka-linux:
    name: Build Kafka for x86_64-unknown-linux-gnu
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-profile == 'release-thin-lto' && inputs.tag || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-11 \
            g++-11 \
            build-essential \
            pkg-config \
            cmake \
            clang \
            zlib1g-dev \
            libzstd-dev \
            liblz4-dev \
            libssl-dev \
            python3

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu-kafka-${{ env.RELEASE_PROFILE }}

      - name: Find and fix librdkafka CMakeLists.txt
        run: |
          cargo fetch
          RDKAFKA_SYS_DIR=$(find ~/.cargo/registry/src -name "rdkafka-sys-*" -type d | head -n 1)
          echo "Found rdkafka-sys at: $RDKAFKA_SYS_DIR"
          CMAKE_FILE="$RDKAFKA_SYS_DIR/librdkafka/CMakeLists.txt"
          if [ -f "$CMAKE_FILE" ]; then
            echo "Found CMakeLists.txt at: $CMAKE_FILE"
            cp "$CMAKE_FILE" "$CMAKE_FILE.bak"
            sed -i 's/cmake_minimum_required(VERSION 3.2)/cmake_minimum_required(VERSION 3.5)/' "$CMAKE_FILE"
            echo "Modified CMakeLists.txt"
          else
            echo "Could not find librdkafka CMakeLists.txt file!"
            exit 1
          fi

      - name: Build with Kafka
        env:
          CC: gcc-11
          CXX: g++-11
          LIBRDKAFKA_SSL_VENDORED: "1"
        run: cargo build --profile "$RELEASE_PROFILE" --target x86_64-unknown-linux-gnu --features kafka

      - name: Rename binary
        run: |
          mv target/x86_64-unknown-linux-gnu/$RELEASE_PROFILE/parseable Parseable_OSS_x86_64-unknown-linux-gnu-kafka

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: Parseable_OSS_x86_64-unknown-linux-gnu-kafka

      - name: Create Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parseable_OSS_x86_64-unknown-linux-gnu-kafka
          path: Parseable_OSS_x86_64-unknown-linux-gnu-kafka

      - name: Publish Archive to Release Page
        if: env.RELEASE_PROFILE == 'release-lto'
        uses: softprops/action-gh-release@v0.1.15
        with:
          draft: false
          tag_name: ${{ inputs.tag }}
          files: Parseable_OSS_x86_64-unknown-linux-gnu-kafka
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-kafka-mac:
    name: Build Kafka for aarch64-apple-darwin
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-profile == 'release-thin-lto' && inputs.tag || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install macOS dependencies
        run: |
          brew install \
            llvm \
            pkg-config \
            zstd \
            lz4 \
            openssl@3.0 \
            python3

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin-kafka-${{ env.RELEASE_PROFILE }}

      - name: Find and fix librdkafka CMakeLists.txt
        run: |
          cargo fetch
          RDKAFKA_SYS_DIR=$(find ~/.cargo/registry/src -name "rdkafka-sys-*" -type d | head -n 1)
          echo "Found rdkafka-sys at: $RDKAFKA_SYS_DIR"
          CMAKE_FILE="$RDKAFKA_SYS_DIR/librdkafka/CMakeLists.txt"
          if [ -f "$CMAKE_FILE" ]; then
            echo "Found CMakeLists.txt at: $CMAKE_FILE"
            cp "$CMAKE_FILE" "$CMAKE_FILE.bak"
            sed -i '' 's/cmake_minimum_required(VERSION 3.2)/cmake_minimum_required(VERSION 3.5)/' "$CMAKE_FILE"
            echo "Modified CMakeLists.txt"
          else
            echo "Could not find librdkafka CMakeLists.txt file!"
            exit 1
          fi

      - name: Build with Kafka
        env:
          LIBRDKAFKA_SSL_VENDORED: "1"
        run: |
          cargo build --profile "$RELEASE_PROFILE" --target aarch64-apple-darwin --features kafka
          strip target/aarch64-apple-darwin/$RELEASE_PROFILE/Parseable

      - name: Rename binary
        run: |
          mv target/aarch64-apple-darwin/$RELEASE_PROFILE/Parseable Parseable_OSS_aarch64-apple-darwin-kafka

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: Parseable_OSS_aarch64-apple-darwin-kafka

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parseable_OSS_aarch64-apple-darwin-kafka
          path: Parseable_OSS_aarch64-apple-darwin-kafka

      - name: Publish Archive to Release Page
        if: env.RELEASE_PROFILE == 'release-lto'
        uses: softprops/action-gh-release@v0.1.15
        with:
          draft: false
          tag_name: ${{ inputs.tag }}
          files: Parseable_OSS_aarch64-apple-darwin-kafka
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-checksum:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: [build-linux, build-windows, build-mac, build-kafka-linux, build-kafka-mac]
    permissions:
      contents: write
    steps:
      - name: Download artifacts created
        uses: actions/download-artifact@v4.1.7
        with:
          pattern: Parseable_OSS_*

      - name: Run shasum command
        run: |
          find . -type f -name "Parseable_OSS_*" -exec shasum {} \; | sed 's/.\/.*\///' > checksum.txt

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum.txt
          path: checksum.txt

      - name: Publish Check Sum to Release Page
        if: env.RELEASE_PROFILE == 'release-lto'
        uses: softprops/action-gh-release@v0.1.15
        with:
          draft: false
          tag_name: ${{ inputs.tag }}
          files: checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-push-docker-image:
    if: github.repository == 'parseablehq/parseable' && (inputs.build-profile || 'release-lto') == 'release-lto'
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-profile == 'release-thin-lto' && inputs.tag || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/parseablehq/parseable

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            quay.io/parseablehq/parseable:${{ inputs.tag }}
            quay.io/parseablehq/parseable:latest
          platforms: linux/amd64,linux/arm64
      
      - name: Build and push kafka amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.kafka
          push: true
          tags: quay.io/parseablehq/parseable:${{ inputs.tag }}-kafka-amd64
          platforms: linux/amd64
          build-args: |
            LIB_DIR=x86_64-linux-gnu

      - name: Build and push kafka arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.kafka
          push: true
          tags: quay.io/parseablehq/parseable:${{ inputs.tag }}-kafka-arm64
          platforms: linux/arm64
          build-args: |
            LIB_DIR=aarch64-linux-gnu
      
      - name: Clean up builder cache
        run: docker builder prune -f
