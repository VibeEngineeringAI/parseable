name: Rust checks and tests
on:
  workflow_call:
    inputs:
      coverage:
        description: Collect and upload combined default and Kafka coverage.
        type: boolean
        default: false
permissions:
  contents: read
env:
  NEXT_ASSETS_PATH: ${{ github.workspace }}/frontend/dist

jobs:
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Linux build resources
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          if sudo fallocate -l 16G /swap.build && sudo chmod 600 /swap.build \
            && sudo mkswap /swap.build && sudo swapon /swap.build; then
            echo "Added 16G swap"
          else
            sudo rm -f /swap.build
            echo "::warning title=Swap::Could not add swap; continuing without it"
          fi
          free -h
          df -h /
      - uses: ./.github/actions/setup-rust-ci
        with:
          cache-key: rust-clippy
          tools: cargo-hack
      - name: Check all feature configurations with Clippy
        # cargo-hack temporarily removes dev dependencies and updates Cargo.lock;
        # --locked would reject that temporary manifest before Clippy can run.
        run: cargo hack clippy --verbose --each-feature --no-dev-deps -- -D warnings

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Linux build resources
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          if sudo fallocate -l 16G /swap.build && sudo chmod 600 /swap.build \
            && sudo mkswap /swap.build && sudo swapon /swap.build; then
            echo "Added 16G swap"
          else
            sudo rm -f /swap.build
            echo "::warning title=Swap::Could not add swap; continuing without it"
          fi
          free -h
          df -h /
      - uses: ./.github/actions/setup-rust-ci
        with:
          cache-key: rust-tests-${{ inputs.coverage && 'coverage' || 'plain' }}
          tools: ${{ inputs.coverage && 'cargo-llvm-cov, nextest' || 'nextest' }}
      - name: Test default feature set
        if: ${{ !inputs.coverage }}
        run: cargo nextest run --locked
      - name: Test Kafka feature
        if: ${{ !inputs.coverage }}
        run: cargo nextest run --locked --features kafka -E 'test(kafka)'
      - name: Clear stale workspace coverage
        if: inputs.coverage
        run: cargo llvm-cov clean --workspace
      - name: Test default feature set with coverage
        if: inputs.coverage
        run: cargo llvm-cov nextest --locked --no-report
      - name: Test Kafka feature with coverage
        if: inputs.coverage
        run: cargo llvm-cov nextest --locked --features kafka --no-report --filter-expr 'test(kafka)'
      - name: Generate combined coverage report
        if: inputs.coverage
        run: cargo llvm-cov report --lcov --output-path coverage.lcov
      - name: Upload coverage report
        if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: coverage.lcov
          if-no-files-found: error
