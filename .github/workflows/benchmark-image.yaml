name: Benchmark application image
on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      cache-namespace:
        required: true
        type: string
      variant:
        required: true
        type: string
      runner:
        required: true
        type: string
      debug:
        required: true
        type: string
      timeout-minutes:
        description: Maximum minutes per paid job.
        type: number
        default: 12
permissions:
  contents: read
jobs:
  image:
    name: Image (${{ inputs.variant }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Record actual machine and derive benchmark Dockerfile
        run: |
          nproc
          free -b
          df -h
          python3 scripts/ci/benchmark-image.py --output "$RUNNER_TEMP/Dockerfile.benchmark"
      - uses: docker/setup-buildx-action@v3
      - name: Compile and export the same source revision
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=${{ inputs.cache-namespace }}-image-${{ inputs.variant }}
          cache-to: type=gha,scope=${{ inputs.cache-namespace }}-image-${{ inputs.variant }},mode=max
          context: .
          file: ${{ runner.temp }}/Dockerfile.benchmark
          platforms: linux/amd64
          tags: parseable-benchmark:${{ github.sha }}-${{ inputs.variant }}
          build-args: |
            CARGO_PROFILE_DEV_DEBUG=${{ inputs.debug }}
            SOURCE_REBUILD=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: type=docker,dest=${{ runner.temp }}/parseable-benchmark.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ inputs.variant }}
          path: ${{ runner.temp }}/parseable-benchmark.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
