name: Frontend
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: frontend
jobs:
  checks:
    name: Format, build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run package
        if: github.event_name == 'workflow_dispatch'
      - name: Upload frontend package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: parseable-frontend
          path: |
            frontend/build.zip
            frontend/build.zip.sha1
          if-no-files-found: error

  browser:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Keep screenshot fonts, Chromium and OS identical to the reviewed baselines.
    # Update together with @playwright/test in frontend/package-lock.json.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ui-1
            command: npm run test:ui -- --shard=1/4 --workers=4
          - suite: ui-2
            command: npm run test:ui -- --shard=2/4 --workers=4
          - suite: ui-3
            command: npm run test:ui -- --shard=3/4 --workers=4
          - suite: ui-4
            command: npm run test:ui -- --shard=4/4 --workers=4
          - suite: production
            command: npm run test:prod -- --workers=4
          - suite: storybook
            command: npm run test:stories
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-results-${{ matrix.suite }}
          path: |
            frontend/playwright-report
            frontend/test-results
